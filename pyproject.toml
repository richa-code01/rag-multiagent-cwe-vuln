[project]
name = "cwe-vuln"
version = "0.9.0"
description = "Thesis repo: RAG-style multi-agent CWE vulnerability detection with six public Java suite evaluations."
readme = "README.md"
authors = [
    { name = "Richa Verma" },
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "jsonschema>=4.26.0",
    "openai>=3.14.1",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.0.1",
    "uvicorn>=0.32.0",
]

[project.scripts]
cwe-vuln = "cwe_vuln.cli.baseline:main"
cwe-vuln-eval = "cwe_vuln.framework.eval:main"
cwe-vuln-kb = "cwe_vuln.cli.knowledge:main"
cwe-vuln-retrieve = "cwe_vuln.cli.retrieval:main"
cwe-vuln-schema = "cwe_vuln.cli.schema:main"
cwe-vuln-evidence = "cwe_vuln.cli.evidence:main"
cwe-vuln-pipeline = "cwe_vuln.framework:main"
cwe-vuln-ui = "cwe_vuln.api.cli:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0",
    "python-docx>=1.2.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
