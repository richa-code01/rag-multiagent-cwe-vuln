[project]
name = "cwe-vuln"
version = "0.2.0"
description = "Thesis repo: Java CWE seed, SAST-style baseline, and a curated CWE knowledge layer (Assignments 1–2)."
readme = "README.md"
authors = [
    { name = "Richa Verma" },
]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cwe-vuln = "cwe_vuln.evaluate:main"
cwe-vuln-eval = "cwe_vuln.evaluate:main"
cwe-vuln-kb = "cwe_vuln.knowledge_cli:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
