[project]
name = "cwe-vuln"
version = "0.4.0"
description = "Thesis repo: Java CWE seed, SAST baseline, CWE knowledge, hybrid retrieval, and reasoning output schema (Assignments 1–4)."
readme = "README.md"
authors = [
    { name = "Richa Verma" },
]
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.26.0",
]

[project.scripts]
cwe-vuln = "cwe_vuln.evaluate:main"
cwe-vuln-eval = "cwe_vuln.evaluate:main"
cwe-vuln-kb = "cwe_vuln.knowledge_cli:main"
cwe-vuln-retrieve = "cwe_vuln.retrieval_cli:main"
cwe-vuln-schema = "cwe_vuln.schema:main"
cwe-vuln-evidence = "cwe_vuln.evidence:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
