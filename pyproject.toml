[project]
name = "cwe-vuln"
version = "0.8.0"
description = "Thesis repo: RAG-style multi-agent CWE vulnerability detection with authored-corpus and Juliet Java subset evaluation."
readme = "README.md"
authors = [
    { name = "Richa Verma" },
]
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.26.0",
    "openai>=3.14.1",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.0.1",
]

[project.scripts]
cwe-vuln = "cwe_vuln.cli.baseline:main"
cwe-vuln-eval = "cwe_vuln.framework.eval:main"
cwe-vuln-kb = "cwe_vuln.cli.knowledge:main"
cwe-vuln-retrieve = "cwe_vuln.cli.retrieval:main"
cwe-vuln-schema = "cwe_vuln.cli.schema:main"
cwe-vuln-evidence = "cwe_vuln.cli.evidence:main"
cwe-vuln-pipeline = "cwe_vuln.framework:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
