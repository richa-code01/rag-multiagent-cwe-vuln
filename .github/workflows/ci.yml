name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check src tests
      - name: Test
        run: uv run pytest
        env:
          GROQ_API_KEY: ""
          OPENAI_API_KEY: ""
          CWE_VULN_LLM_API_KEY: ""
